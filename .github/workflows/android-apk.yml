name: Build Signed Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Upload Keystore if missing
        run: |
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=GrainTradeManager, OU=Mobile, O=GrainTrade, L=Mansoura, ST=Dakahlia, C=EG"
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk GrainTradeManager-release.apk

      - name: Commit Updated Release APK to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GrainTradeManager-release.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GrainTradeManager-release.apk [skip ci]"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push
          fi

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GrainTradeManager-release-apk
          path: app/build/outputs/apk/release/app-release.apk
